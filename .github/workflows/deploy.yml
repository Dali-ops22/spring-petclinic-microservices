name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MAVEN_OPTS: -Dmaven.repo.local=~/.m2/repository

jobs:
  # =========================
  # 1. BUILD
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilation de tous les modules
        run: |
          ./mvnw compile \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true

  # =========================
  # 2. TEST
  # =========================
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Execution des tests
        run: |
          ./mvnw test \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true

      - name: Rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          # ✅ Multi-modules : rapports dans chaque sous-dossier
          path: '**/target/surefire-reports/'
          retention-days: 7

  # =========================
  # 3. CODE QUALITY
  # =========================
  quality:
    name: Qualite du code
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Analyse CodeClimate
        run: |
          mkdir -p codequality-results
          docker run --rm \
            -e CODECLIMATE_CODE="$PWD" \
            -v "$PWD":/code \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/cc:/tmp/cc \
            codeclimate/codeclimate analyze -f html > codequality-results/index.html

      - name: Rapport qualite
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: codequality-results/
          retention-days: 7

  # =========================
  # 4. PACKAGE
  # ✅ CORRIGÉ: projet multi-modules — les JARs sont dans */target/
  # =========================
  package:
    name: Package JARs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build de tous les modules
        run: |
          ./mvnw package -DskipTests \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end

      # ✅ Vérification que des JARs ont bien été produits avant l'upload
      - name: Verification des JARs produits
        run: |
          echo "JARs trouves:"
          find . -path ./node_modules -prune -o -name "*.jar" \
            -not -path "*/.m2/*" \
            -not -name "*sources*" \
            -not -name "*javadoc*" \
            -print
          JAR_COUNT=$(find . -name "*.jar" \
            -not -path "*/.m2/*" \
            -not -name "*sources*" \
            -not -name "*javadoc*" | wc -l)
          echo "Nombre de JARs: $JAR_COUNT"
          [ "$JAR_COUNT" -gt 0 ] || (echo "Aucun JAR produit!" && exit 1)

      # ✅ CORRIGÉ: ** pour chercher dans tous les sous-dossiers
      - name: Upload artifact app-jars
        uses: actions/upload-artifact@v4
        with:
          name: app-jars
          path: |
            **/target/*.jar
            !**/target/*sources*.jar
            !**/target/*javadoc*.jar
            !**/.m2/**
          retention-days: 1
          if-no-files-found: error

  # =========================
  # 5. SECURITY — Trivy
  # ✅ Scan du code source, pas besoin des JARs
  # =========================
  security:
    name: Scan de securite (Trivy)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - name: Scan Trivy — CRITICAL et HIGH
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Rapport Trivy JSON
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload rapport securite
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: trivy-report.json
          retention-days: 30

  # =========================
  # 6. DEPLOY STAGING — Codespaces
  # ✅ CORRIGÉ: télécharge app-jars (multi-modules)
  # =========================
  deploy_staging:
    name: Deploy Staging (Codespaces)
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: staging
      url: https://${{ vars.CODESPACE_NAME }}-8080.app.github.dev
    steps:
      - uses: actions/checkout@v4

      - name: Telechargement des JARs
        uses: actions/download-artifact@v4
        with:
          name: app-jars
          path: jars/

      # ✅ Affiche l'arborescence des JARs téléchargés pour debug
      - name: Verification des JARs telecharges
        run: |
          echo "JARs disponibles:"
          find jars/ -name "*.jar" | sort

      - name: Deploiement sur Codespaces
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          # Copie tous les JARs dans le Codespace
          find jars/ -name "*.jar" | while read jar; do
            echo "Copie de $jar..."
            gh codespace cp "$jar" remote:/workspaces/ -c $CODESPACE_NAME
          done

          # Redémarre le service principal (api-gateway par défaut)
          # Adapte le nom du JAR à ton microservice principal
          gh codespace ssh -c $CODESPACE_NAME -- "
            pkill -f '\.jar' || true
            sleep 2
            JAR=\$(ls /workspaces/*.jar 2>/dev/null | head -1)
            if [ -z \"\$JAR\" ]; then
              echo 'Aucun JAR dans /workspaces/'
              exit 1
            fi
            echo \"Demarrage de \$JAR\"
            nohup java -jar \"\$JAR\" --server.port=8080 > /tmp/app.log 2>&1 &
            echo 'Application demarree'
          "

      - name: Verification que l appli repond
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          URL="https://$CODESPACE_NAME-8080.app.github.dev"
          echo "Attente de $URL..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            [ "$STATUS" = "200" ] && echo "OK apres $i tentatives" && exit 0
            echo "Tentative $i/30 -- HTTP $STATUS"
            sleep 5
          done
          echo "Timeout: application non disponible"
          exit 1

  # =========================
  # 7. PERFORMANCE
  # =========================
  performance:
    name: Tests de performance
    runs-on: ubuntu-latest
    needs: deploy_staging
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Installation des outils
        run: sudo apt-get install -y wget curl

      - name: Tests Sitespeed.io
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          URL="https://$CODESPACE_NAME-8080.app.github.dev"
          mkdir -p gitlab-exporter sitespeed-results

          wget -q -O ./gitlab-exporter/index.js \
            https://gitlab.com/gitlab-org/gl-performance/raw/master/index.js

          docker run --shm-size=1g --rm \
            -v "$(pwd)":/sitespeed.io \
            sitespeedio/sitespeed.io \
            --plugins.add ./gitlab-exporter \
            --outputFolder sitespeed-results \
            "$URL"

      - name: Rapport performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: sitespeed-results/
          retention-days: 7

  # =========================
  # 8. DEPLOY PROD
  # ✅ Rebuild propre pour la production
  # =========================
  deploy_prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy_staging, quality, security]
    environment:
      name: production
      url: https://votre-domaine-prod.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build prod
        run: |
          ./mvnw package -DskipTests \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end

      - name: JARs produits pour la prod
        run: find . -name "*.jar" -not -path "*/.m2/*" | sort

      - name: Deploy en production
        run: |
          echo "Deploiement en production du commit ${{ github.sha }}"
          # Remplace par ta vraie commande prod:
          # scp */target/*.jar user@prod-server:/app/
          # kubectl set image deployment/app app=image:${{ github.sha }}
