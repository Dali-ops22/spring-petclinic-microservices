name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MAVEN_OPTS: -Dmaven.repo.local=~/.m2/repository

jobs:
  # ─────────────────────────────────────────────
  # 1. COMPILATION
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compilation
        run: |
          ./mvnw compile \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true

  # ─────────────────────────────────────────────
  # 2. TESTS UNITAIRES
  # ─────────────────────────────────────────────
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Execution des tests
        run: |
          ./mvnw test \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true
      - name: Rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. QUALITE DU CODE
  # ─────────────────────────────────────────────
  quality:
    name: Qualite du code
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Analyse CodeClimate
        run: |
          mkdir -p codequality-results
          docker run --rm \
            -e CODECLIMATE_CODE="$PWD" \
            -v "$PWD":/code \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/cc:/tmp/cc \
            codeclimate/codeclimate analyze -f html > codequality-results/index.html
      - name: Rapport qualite
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: codequality-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. PACKAGING DES JARs
  # ─────────────────────────────────────────────
  package:
    name: Package JARs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build de tous les modules
        run: |
          ./mvnw package -DskipTests \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end
      - name: Verification des JARs produits
        run: |
          echo "JARs trouves:"
          find . -name "*.jar" \
            -not -path "*/.m2/*" \
            -not -name "*sources*" \
            -not -name "*javadoc*"
          COUNT=$(find . -name "*.jar" \
            -not -path "*/.m2/*" \
            -not -name "*sources*" \
            -not -name "*javadoc*" | wc -l)
          echo "Total: $COUNT JAR(s)"
          [ "$COUNT" -gt 0 ] || (echo "Aucun JAR produit" && exit 1)
      - name: Upload artifact app-jars
        uses: actions/upload-artifact@v4
        with:
          name: app-jars
          path: |
            **/target/*.jar
            !**/target/*sources*.jar
            !**/target/*javadoc*.jar
            !**/.m2/**
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 5. SCAN DE SECURITE
  # ─────────────────────────────────────────────
  security:
    name: Scan de securite Trivy
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - name: Scan Trivy CRITICAL et HIGH
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Rapport Trivy JSON
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      - name: Upload rapport securite
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: trivy-report.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # 6. DEPLOIEMENT STAGING
  # SSH est maintenant permanent grâce à sshd
  # dans devcontainer.json (feature + postStartCommand).
  # gh codespace cp et gh codespace ssh fonctionnent.
  # ─────────────────────────────────────────────
  deploy_staging:
    name: Deploy Staging Codespaces
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: staging
      url: https://${{ vars.CODESPACE_NAME }}-8080.app.github.dev
    steps:
      - uses: actions/checkout@v4

      - name: Telechargement des JARs
        uses: actions/download-artifact@v4
        with:
          name: app-jars
          path: jars/

      - name: Liste des JARs telecharges
        run: find jars/ -name "*.jar" | sort

      - name: Deploiement sur Codespaces
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CS_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          # ── Étape 1 : résolution du nom ────────────────────────────────────
          RESOLVED="$CS_NAME"

          if [ -z "$RESOLVED" ]; then
            echo "⚠️  Détection automatique du Codespace..."
            RESOLVED=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces" \
              | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)
          fi

          if [ -z "$RESOLVED" ]; then
            echo "❌ Impossible de trouver un Codespace actif."
            echo "  • Vérifie que GH_TOKEN a le scope 'codespace'"
            echo "  • Vérifie que le Codespace est actif sur https://github.com/codespaces"
            exit 1
          fi

          echo "✅ Codespace cible : $RESOLVED"
          export GH_TOKEN=$GH_TOKEN

          # ── Étape 2 : copie des JARs ───────────────────────────────────────
          mapfile -t JARS < <(find jars/ -name "*.jar" | sort)

          if [ ${#JARS[@]} -eq 0 ]; then
            echo "❌ Aucun JAR trouvé dans jars/"
            exit 1
          fi

          for jar in "${JARS[@]}"; do
            BASENAME=$(basename "$jar")
            echo "📦 Copie : $jar → remote:/workspaces/$BASENAME"
            gh codespace cp "$jar" "remote:/workspaces/$BASENAME" --codespace "$RESOLVED"
          done

          echo "✅ Tous les JARs copiés."

          # ── Étape 3 : démarrage de l'application ──────────────────────────
          gh codespace ssh --codespace "$RESOLVED" -- bash -s << 'ENDSSH'
            echo "🔄 Arrêt application existante..."
            pkill -f "\.jar" 2>/dev/null || true
            sleep 2
            JAR=$(ls /workspaces/*.jar 2>/dev/null | head -1)
            if [ -z "$JAR" ]; then
              echo "❌ Aucun JAR dans /workspaces/"
              exit 1
            fi
            echo "🚀 Démarrage : $JAR"
            nohup java -jar "$JAR" --server.port=8080 > /tmp/app.log 2>&1 &
            sleep 3
            if pgrep -f "\.jar" > /dev/null; then
              echo "✅ Application démarrée"
            else
              echo "❌ Echec. Log :"
              tail -30 /tmp/app.log
              exit 1
            fi
          ENDSSH

          echo "RESOLVED_CS=$RESOLVED" >> "$GITHUB_ENV"

      - name: Verification que l appli repond
        run: |
          URL="https://${RESOLVED_CS}-8080.app.github.dev"
          echo "🔍 Test de disponibilité : $URL"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application disponible après $i tentative(s) — HTTP $STATUS"
              exit 0
            fi
            echo "  Tentative $i/30 — HTTP $STATUS (attente 5s...)"
            sleep 5
          done
          echo "❌ Timeout : l'application ne répond pas après 150 secondes"
          exit 1

  # ─────────────────────────────────────────────
  # 7. TESTS DE PERFORMANCE
  # ─────────────────────────────────────────────
  performance:
    name: Tests de performance
    runs-on: ubuntu-latest
    needs: deploy_staging
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Installation des outils
        run: sudo apt-get install -y wget curl
      - name: Tests Sitespeed.io
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          URL="https://$CODESPACE_NAME-8080.app.github.dev"
          mkdir -p gitlab-exporter sitespeed-results
          wget -q -O ./gitlab-exporter/index.js \
            https://gitlab.com/gitlab-org/gl-performance/raw/master/index.js
          docker run --shm-size=1g --rm \
            -v "$(pwd)":/sitespeed.io \
            sitespeedio/sitespeed.io \
            --plugins.add ./gitlab-exporter \
            --outputFolder sitespeed-results \
            "$URL"
      - name: Rapport performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: sitespeed-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 8. DEPLOIEMENT PRODUCTION
  # ─────────────────────────────────────────────
  deploy_prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy_staging, quality, security]
    environment:
      name: production
      url: https://votre-domaine-prod.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build prod
        run: |
          ./mvnw package -DskipTests \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end
      - name: Deploy en production
        run: |
          echo "🚀 Déploiement en production du commit ${{ github.sha }}"
          find . -name "*.jar" -not -path "*/.m2/*" | sort
          # Remplace par ta vraie commande prod :
          # scp */target/*.jar user@prod-server:/app/
          # kubectl set image deployment/app app=image:${{ github.sha }}
