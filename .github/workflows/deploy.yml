name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Dmaven.repo.local=~/.m2/repository

jobs:

  # =========================================================
  # BUILD
  # =========================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilation
        run: |
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  # =========================================================
  # TESTS
  # =========================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Tests unitaires
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Upload rapports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/target/surefire-reports/"

  # =========================================================
  # PACKAGE
  # =========================================================
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build JARs
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Verification JARs
        run: |
          COUNT=$(find . -name "*.jar" \
            -not -path "*/.m2/*" \
            -not -name "*sources*" \
            -not -name "*javadoc*" | wc -l)

          echo "JARs trouves : $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "Aucun JAR genere"
            exit 1
          fi

  # =========================================================
  # SECURITY
  # =========================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0

  # =========================================================
  # DEPLOY STAGING
  # =========================================================
  deploy_staging:
    name: Deploy Codespaces
    runs-on: ubuntu-latest
    needs: package

    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------
      # Installation GitHub CLI
      # -----------------------------------------------------
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # -----------------------------------------------------
      # Configuration SSH
      # -----------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # -----------------------------------------------------
      # Deploy vers Codespace
      # -----------------------------------------------------
      - name: Deploy application
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |

          echo "Codespace cible : $CODESPACE_NAME"

          gh codespace ssh \
            -c "$CODESPACE_NAME" \
            --config "IdentityFile ~/.ssh/id_ed25519" \
            -- bash -c '

              set -e

              cd /workspaces/spring-petclinic-microservices

              echo "Git pull..."
              git pull origin main

              echo "Build Maven..."
              chmod +x mvnw
              ./mvnw clean package -DskipTests -q

              echo "Stop ancienne application..."
              pkill -f "\.jar" || true

              sleep 3

              echo "Recherche du JAR..."
              JAR=$(find . -name "*.jar" \
                -not -path "*/.m2/*" \
                -not -name "*sources*" \
                -not -name "*javadoc*" \
                | head -1)

              echo "JAR = $JAR"

              if [ -z "$JAR" ]; then
                echo "Aucun JAR trouve"
                exit 1
              fi

              echo "Lancement application..."
              nohup java -jar "$JAR" \
                --server.port=8080 \
                > /tmp/app.log 2>&1 &

              sleep 10

              echo "Verification process..."
              pgrep -f "\.jar"

              echo "Derniers logs :"
              tail -20 /tmp/app.log
            '

      # -----------------------------------------------------
      # Verification HTTP
      # -----------------------------------------------------
      - name: Verification HTTP
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |

          URL="https://${CODESPACE_NAME}-8080.app.github.dev"

          echo "Verification : $URL"

          for i in $(seq 1 30); do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

            echo "Tentative $i -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application disponible"
              exit 0
            fi

            sleep 5

          done

          echo "Application inaccessible"
          exit 1

  # =========================================================
  # PERFORMANCE
  # =========================================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy_staging
    continue-on-error: true

    steps:
      - name: Simple performance check
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |

          URL="https://${CODESPACE_NAME}-8080.app.github.dev"

          curl -I "$URL"

  # =========================================================
  # PRODUCTION
  # =========================================================
  deploy_prod:
    name: Production
    runs-on: ubuntu-latest
    needs: [deploy_staging, security]

    environment:
      name: production

    steps:
      - name: Production deploy
        run: |
          echo "Deploy production OK"
