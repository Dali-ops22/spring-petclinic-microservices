name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Deploy staging
        run: |
          docker compose down
          docker compose up -d
    environment:
      name: staging

  deploy_prod:
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v3

      - name: Deploy production
        run: |
          docker compose down
          docker compose up -d
