name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cache Maven partagé entre tous les jobs
env:
  MAVEN_OPTS: -Dmaven.repo.local=~/.m2/repository

jobs:
  # =========================
  # 1. BUILD
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven                  # Cache Maven automatique

      - name: Compilation
        run: |
          ./mvnw compile \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true

  # =========================
  # 2. TEST
  # =========================
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Exécution des tests
        run: |
          ./mvnw test \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end --show-version \
            -Djava.awt.headless=true

      - name: Publication des résultats de tests
        uses: actions/upload-artifact@v4
        if: always()                    # Publie même si les tests échouent
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # =========================
  # 3. CODE QUALITY
  # =========================
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true             # Équivalent de allow_failure: true
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Analyse CodeClimate
        run: |
          mkdir -p codequality-results
          docker run --rm \
            -e CODECLIMATE_CODE="$PWD" \
            -v "$PWD":/code \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/cc:/tmp/cc \
            codeclimate/codeclimate analyze -f html > codequality-results/index.html

      - name: Publication du rapport qualité
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: codequality-results/
          retention-days: 7

  # =========================
  # 4. PACKAGE
  # =========================
  package:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: test                         # Démarre dès que test passe (parallèle avec quality)
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Création du JAR
        run: |
          ./mvnw package -DskipTests \
            -Dhttps.protocols=TLSv1.2 \
            --batch-mode --errors --fail-at-end

      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # =========================
  # 5. DEPLOY STAGING — Codespaces
  # =========================
  deploy_staging:
    name: Deploy Staging (Codespaces)
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: staging
      url: https://${{ vars.CODESPACE_NAME }}-8080.app.github.dev
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Récupération du JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Déploiement sur GitHub Codespaces
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          # Copie du JAR dans le Codespace
          gh codespace cp target/*.jar remote:/workspaces/ -c $CODESPACE_NAME

          # Redémarrage de l'application
          gh codespace ssh -c $CODESPACE_NAME -- \
            "pkill -f '\.jar' || true && \
             sleep 2 && \
             nohup java -jar /workspaces/*.jar --server.port=8080 > /tmp/app.log 2>&1 &"

          echo "Application démarrée sur le Codespace $CODESPACE_NAME"

      - name: Vérification que l'appli répond
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          URL="https://$CODESPACE_NAME-8080.app.github.dev"
          echo "Attente de $URL..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application disponible après $i tentatives"
              exit 0
            fi
            echo "Tentative $i/30 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Timeout: l'application ne répond pas"
          exit 1

  # =========================
  # 6. PERFORMANCE
  # =========================
  performance:
    name: Tests de performance
    runs-on: ubuntu-latest
    needs: deploy_staging
    continue-on-error: true
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation des outils
        run: apk add --no-cache curl docker-cli || apt-get install -y curl 2>/dev/null || true

      - name: Tests Sitespeed.io
        env:
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          URL="https://$CODESPACE_NAME-8080.app.github.dev"
          mkdir -p gitlab-exporter sitespeed-results

          wget -q -O ./gitlab-exporter/index.js \
            https://gitlab.com/gitlab-org/gl-performance/raw/master/index.js

          docker run --shm-size=1g --rm \
            -v "$(pwd)":/sitespeed.io \
            sitespeedio/sitespeed.io \
            --plugins.add ./gitlab-exporter \
            --outputFolder sitespeed-results \
            $URL

      - name: Publication du rapport de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: sitespeed-results/
          retention-days: 7

  # =========================
  # 7. SECURITY — Trivy
  # =========================
  security:
    name: Scan de sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Récupération du JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Scan Trivy (vulnérabilités CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'              # Échoue si CRITICAL trouvé

      - name: Rapport Trivy complet (JSON)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Publication du rapport sécurité
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: trivy-report.json
          retention-days: 30

  # =========================
  # 8. DEPLOY PROD
  # =========================
  deploy_prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy_staging, quality, security]
    environment:
      name: production                  # Demande une approbation manuelle dans GitHub
      url: https://votre-domaine-prod.com
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Récupération du JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Deploy en production
        run: |
          echo "🚀 Déploiement en production du commit ${{ github.sha }}"
          # Remplace cette commande par ton vrai déploiement prod
          # Ex: scp, kubectl, docker push, etc.
