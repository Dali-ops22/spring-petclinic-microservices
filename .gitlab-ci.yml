stages:
  - build
  - test
  - quality
  - package

cache:
  paths:
    - .m2/repository
  key: "$CI_JOB_NAME"

# =========================
# BUILD
# =========================
build_job:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  script:
    - ./mvnw compile
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      --batch-mode --errors --fail-at-end --show-version
      -Djava.awt.headless=true

# =========================
# TEST
# =========================
test_job:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - ./mvnw test
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      --batch-mode --errors --fail-at-end --show-version
      -Djava.awt.headless=true

# =========================
# CODE QUALITY
# =========================
code_quality_job:
  stage: quality
  image: docker:24
  services:
    - docker:24-dind
  allow_failure: true
  script:
    - mkdir -p codequality-results
    - docker run --rm
        -e CODECLIMATE_CODE="$PWD"
        -v "$PWD":/code
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /tmp/cc:/tmp/cc
        codeclimate/codeclimate analyze -f html > codequality-results/index.html
  artifacts:
    paths:
      - codequality-results/